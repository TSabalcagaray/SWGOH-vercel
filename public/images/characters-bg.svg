<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#3a0d12"/>
      <stop offset="0.55" stop-color="#160609"/>
      <stop offset="1" stop-color="#050203"/>
    </radialGradient>
    <radialGradient id="smoke" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff3b3b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="smokeBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4aa8ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4aa8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glowSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1000" height="1200" fill="url(#bg)"/>
  <ellipse cx="380" cy="520" rx="420" ry="360" fill="url(#smoke)"/>
  <ellipse cx="650" cy="640" rx="380" ry="320" fill="url(#smokeBlue)"/>

  <!-- Poussière -->
  <g fill="#fff" opacity="0.5">
    <circle cx="90" cy="140" r="1.4"/><circle cx="210" cy="300" r="1"/><circle cx="820" cy="180" r="1.6"/>
    <circle cx="930" cy="420" r="1"/><circle cx="140" cy="760" r="1.2"/><circle cx="870" cy="900" r="1.3"/>
    <circle cx="460" cy="110" r="1"/><circle cx="660" cy="80" r="1.2"/><circle cx="60" cy="1040" r="1"/>
    <circle cx="740" cy="1110" r="1.4"/><circle cx="320" cy="1000" r="1"/><circle cx="560" cy="1150" r="1.1"/>
  </g>

  <!-- Sabre rouge -->
  <g transform="rotate(-38 500 600)">
    <rect x="488" y="140" width="24" height="560" rx="12" fill="#ff2a2a" filter="url(#glow)"/>
    <rect x="493" y="150" width="14" height="545" rx="7" fill="#ff5a5a" filter="url(#glowSmall)"/>
    <rect x="496" y="155" width="8" height="540" rx="4" fill="#fff4f4"/>
    <rect x="490" y="700" width="20" height="120" rx="3" fill="#2a2a2e"/>
    <rect x="490" y="720" width="20" height="8" fill="#55555c"/>
    <rect x="490" y="760" width="20" height="8" fill="#55555c"/>
  </g>

  <!-- Sabre bleu -->
  <g transform="rotate(38 500 600)">
    <rect x="488" y="140" width="24" height="560" rx="12" fill="#2a8cff" filter="url(#glow)"/>
    <rect x="493" y="150" width="14" height="545" rx="7" fill="#6cb6ff" filter="url(#glowSmall)"/>
    <rect x="496" y="155" width="8" height="540" rx="4" fill="#f2f8ff"/>
    <rect x="490" y="700" width="20" height="120" rx="3" fill="#2a2a2e"/>
    <rect x="490" y="720" width="20" height="8" fill="#6a6a72"/>
    <rect x="490" y="760" width="20" height="8" fill="#6a6a72"/>
  </g>

  <!-- Point d'impact -->
  <circle cx="500" cy="430" r="60" fill="#fff" opacity="0.35" filter="url(#glow)"/>
  <circle cx="500" cy="430" r="10" fill="#fff" filter="url(#glowSmall)"/>

  <!-- Silhouettes -->
  <g fill="#030102">
    <path d="M120 1200 L140 980 Q150 900 210 880 L235 820 Q215 790 225 755 Q245 715 285 725 Q320 740 312 790 Q305 820 285 835 L310 880 Q370 905 380 980 L400 1200 Z"/>
    <path d="M600 1200 L620 990 Q630 910 690 885 L712 830 Q692 800 702 765 Q722 725 762 735 Q797 750 789 800 Q782 830 762 845 L786 885 Q846 910 860 990 L880 1200 Z"/>
  </g>
  <rect y="1050" width="1000" height="150" fill="#000" opacity="0.4"/>
</svg>
