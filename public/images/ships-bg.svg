<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02060f"/>
      <stop offset="0.6" stop-color="#071a33"/>
      <stop offset="1" stop-color="#0b2b4a"/>
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7a5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7a5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="25%" r="80%">
      <stop offset="0" stop-color="#6fc3ff"/>
      <stop offset="0.45" stop-color="#1d5d9a"/>
      <stop offset="1" stop-color="#04162b"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fd4ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#bfe8ff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="trailRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffb08a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1000" height="1200" fill="url(#bg)"/>
  <ellipse cx="700" cy="330" rx="460" ry="300" fill="url(#nebula)"/>

  <!-- Étoiles -->
  <g fill="#fff">
    <circle cx="60" cy="90" r="1.5" opacity="0.9"/><circle cx="180" cy="210" r="1" opacity="0.6"/>
    <circle cx="300" cy="60" r="1.2" opacity="0.8"/><circle cx="420" cy="180" r="0.9" opacity="0.5"/>
    <circle cx="520" cy="40" r="1.6" opacity="0.9"/><circle cx="640" cy="150" r="1" opacity="0.7"/>
    <circle cx="760" cy="70" r="1.3" opacity="0.8"/><circle cx="880" cy="200" r="1" opacity="0.6"/>
    <circle cx="960" cy="40" r="1.2" opacity="0.7"/><circle cx="110" cy="380" r="1.1" opacity="0.6"/>
    <circle cx="250" cy="470" r="1.4" opacity="0.8"/><circle cx="370" cy="330" r="0.8" opacity="0.5"/>
    <circle cx="590" cy="420" r="1" opacity="0.6"/><circle cx="840" cy="460" r="1.5" opacity="0.9"/>
    <circle cx="940" cy="330" r="0.9" opacity="0.5"/><circle cx="40" cy="600" r="1.2" opacity="0.7"/>
    <circle cx="200" cy="660" r="0.9" opacity="0.5"/><circle cx="460" cy="600" r="1.3" opacity="0.7"/>
    <circle cx="700" cy="560" r="1" opacity="0.6"/><circle cx="910" cy="640" r="1.2" opacity="0.7"/>
  </g>

  <!-- Planète -->
  <circle cx="500" cy="1500" r="760" fill="#5fb8ff" opacity="0.35" filter="url(#haze)"/>
  <circle cx="500" cy="1500" r="740" fill="url(#planet)"/>

  <!-- Tirs laser -->
  <g filter="url(#glow)">
    <rect x="330" y="520" width="90" height="5" rx="2.5" fill="#ff4b4b" transform="rotate(-20 375 522)"/>
    <rect x="610" y="430" width="90" height="5" rx="2.5" fill="#53ff7a" transform="rotate(-20 655 432)"/>
  </g>
  <g>
    <rect x="330" y="520" width="90" height="2" rx="1" fill="#ffdede" transform="rotate(-20 375 522)"/>
    <rect x="610" y="430" width="90" height="2" rx="1" fill="#e2ffe8" transform="rotate(-20 655 432)"/>
  </g>

  <!-- Vaisseau principal (chasseur en X) -->
  <g transform="translate(560 640) rotate(-20)">
    <rect x="-320" y="-6" width="300" height="12" fill="url(#trail)" filter="url(#glow)"/>
    <g fill="#0b1220" stroke="#5c7a99" stroke-width="2">
      <path d="M-20 -10 L150 -4 L175 0 L150 4 L-20 10 Z"/>
      <path d="M10 -8 L50 -70 L70 -70 L45 -8 Z"/>
      <path d="M10 8 L50 70 L70 70 L45 8 Z"/>
      <rect x="40" y="-76" width="80" height="6" rx="2"/>
      <rect x="40" y="70" width="80" height="6" rx="2"/>
    </g>
    <circle cx="-22" cy="0" r="7" fill="#bfe8ff" filter="url(#glow)"/>
  </g>

  <!-- Chasseur ennemi -->
  <g transform="translate(260 380)">
    <rect x="-220" y="-3" width="190" height="6" fill="url(#trailRed)" filter="url(#glow)" transform="rotate(-20)"/>
    <g fill="#0b1220" stroke="#6e7f92" stroke-width="2">
      <path d="M-30 -45 L-22 -45 L-22 45 L-30 45 Z"/>
      <path d="M22 -45 L30 -45 L30 45 L22 45 Z"/>
      <rect x="-22" y="-3" width="44" height="6"/>
      <circle r="15"/>
    </g>
    <circle r="6" fill="#1f3550"/>
  </g>

  <!-- Croiseur au loin -->
  <path d="M760 250 L960 300 L760 320 Z" fill="#0a1424" stroke="#3d5675" stroke-width="1.5" opacity="0.85"/>
  <rect x="820" y="290" width="30" height="8" fill="#0a1424" stroke="#3d5675" stroke-width="1" opacity="0.85"/>
</svg>
